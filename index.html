<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<button id="themeToggle">🌙 Темна тема</button>
<h1>catalog country</h1>
<div class="modal" id="modal">
    <div class="modal-content">
        <span class="close-btn" id="closeBtn">&times;</span>
        <img id="modalFlag" src="" alt="flag">
        <h2 id="modalName"></h2>
    </div>
</div>
<div class="container">
<div class="filter">
    <input type="text" id="search" placeholder="search country">
    <select id="region">
        <option value="all">All</option>
    </select>
</div>
<p>founded countries <span id="count"></span></p>
<div id="message"></div>
<div id="countriesList" class="countries-grid"></div>
</div>
<script src="script.js"></script>
</body>
</html>
